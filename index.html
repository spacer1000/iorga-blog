<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liceul Teoretic "Nicolae Iorga" | BLOG</title>
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'SF Pro Display', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(-45deg, #4facfe, #00f2fe, #e73c7e, #ee7752);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
            padding: 36px 18px; /* Redus încă 5% */
        }

        @keyframes gradient {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        /* HEADER */
        .header-box {
            text-align: center;
            margin-bottom: 36px;
        }

            .header-box h1 {
                font-size: 3.15rem; /* Redus la ~3.1rem */
                font-weight: 800;
                text-shadow: 0 9px 18px rgba(0,0,0,0.2);
                margin-bottom: 4.5px;
            }

            .header-box p {
                font-size: 1.62rem;
                letter-spacing: 13.5px;
                font-weight: 300;
                opacity: 0.9;
            }

        /* CARD PRINCIPAL */
        .glass-card {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(25px);
            border: 1.8px solid rgba(255, 255, 255, 0.3);
            border-radius: 36px;
            padding: 45px; /* Redus de la 47.5 */
            width: 100%;
            max-width: 630px; /* Redus de la 665px */
            box-shadow: 0 22px 45px rgba(0,0,0,0.2);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin-bottom: 45px;
        }

            /* EFECT LIFT - CARD */
            .glass-card:hover {
                transform: translateY(-18px) scale(1.02);
                box-shadow: 0 36px 72px rgba(0,0,0,0.3);
                background: rgba(255, 255, 255, 0.25);
            }

        /* CHIPS */
        .chips {
            display: flex;
            justify-content: center;
            gap: 13.5px;
            margin-bottom: 27px;
            flex-wrap: wrap;
        }

        .chip {
            padding: 13.5px 27px;
            border-radius: 22.5px;
            background: rgba(255, 255, 255, 0.15);
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 0.9px solid rgba(255,255,255,0.2);
        }

            .chip:hover {
                transform: translateY(-4.5px);
                background: rgba(255, 255, 255, 0.3);
            }

            .chip.active {
                background: white;
                color: #e73c7e;
                box-shadow: 0 9px 18px rgba(0,0,0,0.2);
            }

        /* INPUTURI */
        input, textarea {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            border: 1.8px solid rgba(255, 255, 255, 0.2);
            padding: 18px;
            border-radius: 18px;
            color: white;
            margin-bottom: 18px;
            outline: none;
            font-size: 1.08rem;
            transition: all 0.3s;
        }

            input:focus, textarea:focus {
                background: rgba(255, 255, 255, 0.2);
                border-color: white;
                transform: scale(1.01);
            }

        /* BUTON POSTEAZA - LIFT */
        #publishBtn {
            width: 100%;
            padding: 22.5px;
            border-radius: 22.5px;
            border: none;
            background: white;
            color: #e73c7e;
            font-weight: 800;
            font-size: 1.35rem;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 9px 22px rgba(0,0,0,0.15);
        }

            #publishBtn:hover {
                transform: translateY(-9px);
                box-shadow: 0 18px 36px rgba(0,0,0,0.3);
                filter: brightness(1.05);
            }

        /* FEED POSTARI */
        .postare {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 31.5px;
            padding: 36px;
            width: 100%;
            max-width: 630px;
            margin-top: 22.5px;
            border: 0.9px solid rgba(255, 255, 255, 0.1);
            transition: all 0.4s ease;
        }

            .postare:hover {
                transform: translateY(-9px);
                background: rgba(255, 255, 255, 0.2);
            }

        .post-cat {
            background: #e73c7e;
            color: white;
            padding: 4.5px 13.5px;
            border-radius: 9px;
            font-size: 0.8rem;
            font-weight: 800;
            text-transform: uppercase;
        }

        .post-title {
            font-size: 1.8rem;
            margin: 13.5px 0;
            font-weight: 800;
        }

        .post-text {
            font-size: 1.17rem;
            line-height: 1.6;
            opacity: 0.95;
            margin-bottom: 18px;
        }

        .post-author {
            font-size: 0.9rem;
            opacity: 0.7;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="header-box">
        <h1>Liceul Teoretic "Nicolae Iorga"</h1>
        <p>BLOG</p>
    </div>

    <div class="glass-card">
        <div class="chips">
            <div class="chip active" onclick="setCat(this, 'Anunțuri')">📢 Anunțuri</div>
            <div class="chip" onclick="setCat(this, 'Confesiuni')">🤫 Confesiuni</div>
            <div class="chip" onclick="setCat(this, 'Consiliu')">🏛️ Consiliu</div>
        </div>
        <input type="text" id="nume" placeholder="Numele tău sau Clasa">
        <input type="text" id="titlu" placeholder="Titlu postare">
        <textarea id="mesaj" rows="3" placeholder="Ce vrei să transmiți comunității?"></textarea>
        <button id="publishBtn" onclick="trimite()">POSTEAZĂ PE BLOG</button>
    </div>

    <div id="feed" style="width:100%; display:flex; flex-direction:column; align-items:center; padding-bottom: 45px;"></div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDmm-tKnZXD91a3_HwUUAOFhI1u2j2urxQ",
            authDomain: "iorga-blog.firebaseapp.com",
            databaseURL: "https://iorga-blog-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "iorga-blog",
            storageBucket: "iorga-blog.firebasestorage.app",
            messagingSenderId: "442444033918",
            appId: "1:442444033918:web:8d280e2f76c47047d38d2f"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let categoriaCurenta = 'Anunțuri';

        function setCat(el, c) {
            document.querySelectorAll('.chip').forEach(x => x.classList.remove('active'));
            el.classList.add('active');
            categoriaCurenta = c;
        }

        function trimite() {
            const n = document.getElementById('nume').value;
            const t = document.getElementById('titlu').value;
            const m = document.getElementById('mesaj').value;
            if (!n || !t || !m) return alert("Te rugăm să completezi tot!");

            db.ref('postari').push({
                autor: n, titlu: t, mesaj: m, cat: categoriaCurenta, timp: Date.now()
            }).then(() => {
                document.getElementById('nume').value = '';
                document.getElementById('titlu').value = '';
                document.getElementById('mesaj').value = '';
                alert("Postat cu succes!");
            });
        }

        db.ref('postari').on('value', (s) => {
            const feed = document.getElementById('feed');
            feed.innerHTML = '';
            const data = s.val();
            if (data) {
                Object.keys(data).reverse().forEach(id => {
                    const p = data[id];
                    feed.innerHTML += `
                            <div class="postare">
                                <span class="post-cat">${p.cat}</span>
                                <h2 class="post-title">${p.titlu}</h2>
                                <p class="post-text">${p.mesaj}</p>
                                <div class="post-author">👤 POSTARE DE: ${p.autor}</div>
                            </div>
                        `;
                });
            }
        });
    </script>
</body>
</html>
