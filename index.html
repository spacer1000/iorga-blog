<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liceul Teoretic "Nicolae Iorga" | BLOG</title>
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.18);
            --glass-border: rgba(255, 255, 255, 0.3);
            --text-primary: #ffffff;
            --accent: #e73c7e;
            --bg-gradient: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            --shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.2);
            --shadow-elevated: 0 15px 35px rgba(0, 0, 0, 0.3);
            --shadow-button-hover: 0 8px 20px rgba(0, 0, 0, 0.25);
        }

        [data-theme="dark"] {
            --glass-bg: rgba(0, 0, 0, 0.4);
            --glass-border: rgba(255, 255, 255, 0.1);
            --bg-gradient: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #1a1a2e);
            --shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'SF Pro Display', sans-serif;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        body {
            min-height: 100vh;
            background: var(--bg-gradient);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-primary);
            padding: 20px;
        }

        @keyframes gradientBG {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        header {
            text-align: center;
            margin-top: 20px;
            margin-bottom: 30px;
            width: 100%;
            max-width: 620px;
        }

            header h1 {
                font-size: 2.2rem;
                font-weight: 800;
                letter-spacing: -1px;
            }

        .mode-switcher {
            display: inline-flex;
            background: rgba(0,0,0,0.15);
            padding: 5px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            margin: 20px 0 15px 0;
            box-shadow: var(--shadow-soft);
        }

        .mode-btn {
            padding: 6px 15px;
            border-radius: 15px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }

        .search-container {
            width: 100%;
            max-width: 400px;
            margin: 0 auto 10px auto;
            position: relative;
        }

            .search-container input {
                padding: 10px 15px 10px 40px;
                margin-bottom: 0;
                background: rgba(255,255,255,0.1);
                border-radius: 20px;
                font-size: 0.9rem;
                box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            }

        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0.6;
            font-size: 0.9rem;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(30px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 30px;
            width: 100%;
            max-width: 620px;
            box-shadow: var(--shadow-soft);
            margin-bottom: 30px;
        }

        .category-picker {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .cat-chip {
            padding: 8px 18px;
            border-radius: 20px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.1);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            color: white;
        }

            /* UMBRE SI RIDICARE CATEGORII */
            .cat-chip:hover {
                transform: translateY(-2px);
                background: rgba(255,255,255,0.2);
                box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            }

            .cat-chip.selected {
                background: white;
                color: var(--accent);
                box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            }

        input, textarea {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            padding: 15px;
            color: white;
            margin-bottom: 12px;
            outline: none;
            font-size: 1rem;
        }

            input:focus, textarea:focus {
                background: rgba(255, 255, 255, 0.2);
                border-color: rgba(255, 255, 255, 0.5);
                transform: translateY(-2px);
                box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            }

        /* BUTONUL POSTEAZA - EFECTE CERUTE */
        button#publish {
            width: 100%;
            padding: 16px;
            border-radius: 15px;
            border: none;
            background: white;
            color: var(--accent);
            font-weight: 800;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            position: relative;
        }

            button#publish:hover {
                transform: translateY(-2px); /* Se ridică cu 2px */
                box-shadow: var(--shadow-button-hover); /* Se face umbra */
            }

            button#publish:active {
                transform: translateY(1px); /* Pare că l-ai apăsat */
                box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            }

        .feed {
            width: 100%;
            max-width: 620px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .postare {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 25px;
            position: relative;
            box-shadow: var(--shadow-soft);
            animation: slideIn 0.5s ease-out forwards;
        }

        .react-pop {
            animation: reactPop 0.4s ease;
        }

        @keyframes reactPop {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(0.97);
            }

            100% {
                transform: scale(1);
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .post-tag {
            display: inline-block;
            font-size: 0.65rem;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 8px;
            margin-bottom: 12px;
            text-transform: uppercase;
            background: var(--accent);
            color: white;
        }

        .like-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 15px;
        }

            .like-btn:hover {
                background: rgba(255,255,255,0.2);
                box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            }

        .delete-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            color: rgba(255,255,255,0.2);
            cursor: pointer;
            font-size: 0.7rem;
        }

            .delete-btn:hover {
                color: #ff4757;
            }

        footer {
            margin-top: auto;
            padding: 40px 0;
            opacity: 0.6;
            font-size: 0.85rem;
            text-align: center;
        }
    </style>
</head>
<body data-theme="light">

    <header>
        <h1>Liceul Teoretic "Nicolae Iorga"</h1>
        <div class="sub-title" style="font-size: 1.2rem; font-weight: 300; text-transform: uppercase; letter-spacing: 6px; opacity: 0.8; margin-top: 5px;">Blog</div>

        <div class="mode-switcher">
            <div id="light-label" class="mode-btn" onclick="setTheme('light')">Light</div>
            <div id="dark-label" class="mode-btn" onclick="setTheme('dark')">Dark</div>
        </div>

        <div class="search-container">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchBox" placeholder="Caută prin postări..." oninput="renderFeed()">
        </div>
    </header>

    <div class="glass-card">
        <div class="category-picker">
            <div class="cat-chip selected" onclick="selectCat(this, 'anunt')">📢 Anunțuri</div>
            <div class="cat-chip" onclick="selectCat(this, 'confesiune')">🤫 Confesiuni</div>
            <div class="cat-chip" onclick="selectCat(this, 'consiliu')">🏛️ Consiliu</div>
            <div class="cat-chip" onclick="selectCat(this, 'altele')">✨ Altele</div>
        </div>
        <input type="text" id="autor" placeholder="Nume sau Clasă">
        <input type="text" id="titlu" placeholder="Titlu">
        <textarea id="mesaj" rows="3" placeholder="Ce vrei să transmiți?"></textarea>
        <button id="publish" onclick="creeazaPostare()">Postează pe Blog</button>
    </div>

    <div id="feed" class="feed"></div>

    <footer>
        <p>Proiect independent creat de un Elev &copy; 2026</p>
    </footer>

    <script>
        let selectedCategory = 'anunt';

        function setTheme(theme) {
            const body = document.body;
            const light = document.getElementById('light-label');
            const dark = document.getElementById('dark-label');
            if (theme === "dark") {
                body.dataset.theme = "dark";
                dark.style.background = "white"; dark.style.color = "black";
                light.style.background = "none"; light.style.color = "white";
            } else {
                body.dataset.theme = "light";
                light.style.background = "white"; light.style.color = "black";
                dark.style.background = "none"; dark.style.color = "white";
            }
        }
        setTheme('light');

        function selectCat(el, cat) {
            document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('selected'));
            el.classList.add('selected');
            selectedCategory = cat;
        }

        function timeSince(date) {
            const seconds = Math.floor((new Date() - date) / 1000);
            if (seconds < 60) return "Chiar acum";
            const minutes = Math.floor(seconds / 60);
            if (minutes < 60) return minutes + " min";
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return hours + " ore";
            return Math.floor(hours / 24) + " zile";
        }

        window.onload = renderFeed;

        function renderFeed() {
            const feed = document.getElementById('feed');
            const searchVal = document.getElementById('searchBox').value.toLowerCase();
            feed.innerHTML = '';

            let postari = JSON.parse(localStorage.getItem('iorga_blog_v6') || '[]');
            const filtered = postari.filter(p =>
                p.titlu.toLowerCase().includes(searchVal) ||
                p.mesaj.toLowerCase().includes(searchVal) ||
                p.autor.toLowerCase().includes(searchVal)
            );

            if (filtered.length === 0) {
                feed.innerHTML = `<div style="text-align:center; padding:40px; opacity:0.6;">Nu am găsit postări.</div>`;
                return;
            }

            filtered.forEach(p => {
                const div = document.createElement('div');
                div.className = 'postare';
                div.id = `post-${p.id}`;
                div.innerHTML = `
                        <button class="delete-btn" onclick="stergePostare(${p.id})">șterge</button>
                        <span class="post-tag">${p.cat}</span>
                        <h3 style="margin-bottom:10px;">${p.titlu}</h3>
                        <p style="opacity:0.9; line-height:1.5; margin-bottom:15px; word-wrap: break-word;">${p.mesaj}</p>
                        <div style="font-size:0.8rem; opacity:0.6;">👤 ${p.autor} • 🕒 ${timeSince(p.id)}</div>
                        <button class="like-btn" onclick="likePost(${p.id})">❤️ <span>${p.likes || 0}</span></button>
                    `;
                feed.appendChild(div);
            });
        }

        function creeazaPostare() {
            const autor = document.getElementById('autor');
            const titlu = document.getElementById('titlu');
            const mesaj = document.getElementById('mesaj');
            if (!autor.value || !titlu.value || !mesaj.value) return;

            const p = { id: Date.now(), autor: autor.value, titlu: titlu.value, mesaj: mesaj.value, cat: selectedCategory, likes: 0 };
            let postari = JSON.parse(localStorage.getItem('iorga_blog_v6') || '[]');
            postari.unshift(p);
            localStorage.setItem('iorga_blog_v6', JSON.stringify(postari));
            renderFeed();
            autor.value = ''; titlu.value = ''; mesaj.value = '';
        }

        function likePost(id) {
            const postEl = document.getElementById(`post-${id}`);
            postEl.classList.add('react-pop');

            let postari = JSON.parse(localStorage.getItem('iorga_blog_v6') || '[]');
            const post = postari.find(p => p.id === id);

            if (post) {
                post.likes = (post.likes || 0) + 1;
                localStorage.setItem('iorga_blog_v6', JSON.stringify(postari));
                postEl.querySelector('.like-btn span').innerText = post.likes;
            }

            setTimeout(() => { postEl.classList.remove('react-pop'); }, 400);
        }

        function stergePostare(id) {
            if (!confirm("Ștergi postarea?")) return;
            let postari = JSON.parse(localStorage.getItem('iorga_blog_v6') || '[]');
            postari = postari.filter(p => p.id !== id);
            localStorage.setItem('iorga_blog_v6', JSON.stringify(postari));
            renderFeed();
        }
    </script>
</body>
</html>
